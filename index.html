<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Perfect Day — Build Yours</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --cream: #FBF3E3;
      --ivory: #FFFCF6;
      --ink: #2B2013;
      --ink-soft: #6b5c46;
      --gold: #F3B341;
      --peach: #F4A876;
      --sunset: #E9613F;
      --sky-blue: #8FC6E8;
      --sky-deep: #3F7FB0;
      --navy: #141B31;
      --navy-deep: #0A0E1C;

      --glass-light: rgba(255, 252, 246, 0.55);
      --glass-border: rgba(255, 255, 255, 0.55);
      --glass-dark: rgba(20, 27, 49, 0.45);
      --glass-dark-border: rgba(255, 255, 255, 0.14);

      --mood: 0;
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;

      --shadow-soft: 0 20px 60px -20px rgba(43, 32, 19, 0.35);
      --ease: cubic-bezier(.22, .9, .32, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--navy-deep);
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: 'Playfair Display', serif;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    ::selection {
      background: var(--gold);
      color: var(--ink);
    }

    /* ============ SKY ENGINE ============ */

    #sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      transition: filter 1.6s var(--ease);
      filter:
        saturate(calc(1 + var(--mood) * 0.28))
        brightness(calc(1 + var(--mood) * 0.06));
    }

    .sky-layer {
      position: absolute;
      inset: -2% -2% -2% -2%;
      opacity: 0;
      transition: opacity 1.8s var(--ease);
      will-change: opacity;
    }

    .sky-morning {
      background:
        radial-gradient(
          120% 70% at 18% 78%,
          rgba(255, 224, 150, 0.9) 0%,
          rgba(255, 224, 150, 0) 55%
        ),
        linear-gradient(
          180deg,
          #FBD9A7 0%,
          #F7C48B 22%,
          #F2A987 44%,
          #EE9A82 62%,
          #F6DDBB 100%
        );
    }

    .sky-afternoon {
      background:
        radial-gradient(
          90% 60% at 50% 8%,
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0) 60%
        ),
        linear-gradient(
          180deg,
          #4E9BD6 0%,
          #6FB4E4 30%,
          #9DCDEE 60%,
          #CFE7F5 100%
        );
    }

    .sky-evening {
      background:
        radial-gradient(
          110% 65% at 82% 62%,
          rgba(255, 205, 150, 0.85) 0%,
          rgba(255, 205, 150, 0) 55%
        ),
        linear-gradient(
          180deg,
          #3C3868 0%,
          #7A4B72 26%,
          #C15E6B 48%,
          #E8804F 68%,
          #F2A85F 100%
        );
    }

    .sky-night {
      background:
        radial-gradient(
          90% 60% at 25% 15%,
          rgba(120, 150, 220, 0.25) 0%,
          rgba(120, 150, 220, 0) 60%
        ),
        linear-gradient(
          180deg,
          #0A0E1E 0%,
          #101835 40%,
          #172248 75%,
          #1D2C55 100%
        );
    }

    body[data-stage="morning"] .sky-morning,
    body[data-stage="afternoon"] .sky-afternoon,
    body[data-stage="evening"] .sky-evening,
    body[data-stage="night"] .sky-night {
      opacity: 1;
    }

    #celestial {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      left: 15%;
      top: 78%;
      transform: translate(-50%, -50%);
      transition:
        left 2.2s var(--ease),
        top 2.2s var(--ease),
        width 1.8s var(--ease),
        height 1.8s var(--ease),
        background 1.8s var(--ease),
        box-shadow 1.8s var(--ease),
        opacity 1.4s var(--ease);
      opacity: 0.95;
    }

    body[data-stage="morning"] #celestial {
      left: 20%;
      top: 76%;
      width: 110px;
      height: 110px;
      background: radial-gradient(
        circle at 35% 35%,
        #FFF3D0,
        #F3B341 60%,
        #E98A3D 100%
      );
      box-shadow:
        0 0 90px 30px rgba(243, 179, 65, 0.55),
        0 0 200px 80px rgba(243, 179, 65, 0.25);
    }

    body[data-stage="afternoon"] #celestial {
      left: 58%;
      top: 16%;
      width: 96px;
      height: 96px;
      background: radial-gradient(
        circle at 35% 35%,
        #FFFDF0,
        #FFE9A8 55%,
        #FFD873 100%
      );
    }

    /* Continue the remaining CSS here... */
  </style>
</head>
